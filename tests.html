import {chapters} from "./content/chapters.js";import {questions} from "./data/questions.js";import {mockExam} from "./data/mock-exam.js";import {split,kfold,confusion,kmeansStep,linkage,apriori} from "./assets/js/calculators.js";import {isCorrect,scoreQuestions} from "./assets/js/quiz.js";
const tests=[
["3 chapters",()=>chapters.length===3],["each chapter id",()=>chapters.every(c=>/^ch[123]$/.test(c.id))],["chapter sections",()=>chapters.every(c=>c.sections.length>=3)],["formula content",()=>chapters.every(c=>c.sections.some(s=>s.formulas?.length))],["90 questions",()=>questions.length===90],["30 ch1",()=>questions.filter(q=>q.chapter==="ch1").length===30],["30 ch2",()=>questions.filter(q=>q.chapter==="ch2").length===30],["30 ch3",()=>questions.filter(q=>q.chapter==="ch3").length===30],["unique ids",()=>new Set(questions.map(q=>q.id)).size===90],["options four",()=>questions.every(q=>q.options.length===4)],["answer indexes valid",()=>questions.every(q=>q.answerIndex>=0&&q.answerIndex<4)],["explanations",()=>questions.every(q=>q.explanation.length>5)],["mock 30",()=>mockExam.length===30],["mock balanced",()=>[0,1,2].every(i=>mockExam.filter(q=>q.chapter===`ch${i+1}`).length===10)],["exact correctness",()=>isCorrect({answerIndex:2},2)&&!isCorrect({answerIndex:2},"1")],["score all",()=>scoreQuestions(questions,Object.fromEntries(questions.map(q=>[q.id,q.answerIndex]))).percent===100],["score none",()=>scoreQuestions(questions,{}).correct===0],["split total",()=>{const x=split(100);return x.train+x.valid+x.test===100}],["split percentages",()=>JSON.stringify(split(100))===JSON.stringify({train:70,valid:15,test:15})],["kfold length",()=>kfold(10,3).length===3],["kfold total",()=>kfold(10,3).reduce((a,b)=>a+b,0)===10],["kfold balance",()=>Math.max(...kfold(10,3))-Math.min(...kfold(10,3))<=1],["confusion accuracy",()=>Math.abs(confusion({tp:45,tn:940,fp:5,fn:10}).accuracy-.985)<.001],["confusion precision",()=>Math.abs(confusion({tp:45,tn:940,fp:5,fn:10}).precision-.9)<.001],["confusion f1",()=>confusion({tp:1,tn:1,fp:0,fn:0}).f1===1],["zero safe",()=>confusion({}).precision===0],["kmeans assignment",()=>kmeansStep([[0,0],[10,10]],[[0,0],[10,10]]).groups.join(",")==="0,1"],["kmeans update",()=>kmeansStep([[0,0],[2,0]],[[0,0]]).centroids[0][0]===1],["single linkage",()=>linkage([[0,0]],[[3,4]])===5],["complete linkage",()=>linkage([[0,0],[1,0]],[[3,0]],"complete")===3],["average linkage",()=>linkage([[0,0],[2,0]],[[4,0]],"average")===3],["apriori threshold",()=>apriori([["a"],["a"],["b"]],.66)[0].item==="a"],["static module data",()=>location.protocol==="file:"||location.protocol==="http:"||location.protocol==="https:"]
